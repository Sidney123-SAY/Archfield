<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archfield</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : barre de démo, puis l'app artisan (barre latérale bleu encre sur ordinateur, onglets en bas sur téléphone) ou le lien privé du client. Identité Archfield : encre, orange, béton, vert, ambre. */
:root {
  --encre: #14263D;
  --orange: #C2410C;
  --beton: #F1F3F5;
  --vert: #26774B;
  --ambre: #D99A2B;
  --surface: #ffffff;
  --ink: #14263D;
  --muted: #5E6A7A;
  --line: #E2E6EB;
  --gris-barre: #C8CED6;
  --orange-soft: #FBEAE2;
  --vert-soft: #E2F1E7;
  --ambre-soft: #FCF1DB;
  --ambre-ink: #7A4E06;
  --demo: #0B1727;
  --shadow: 0 1px 2px rgba(20, 38, 61, .05), 0 4px 14px rgba(20, 38, 61, .05);
  --f-title: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--beton); color: var(--ink); font: 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--demo); }
h1, h2, h3 { font-family: var(--f-title); margin: 0; line-height: 1.2; text-wrap: balance; color: var(--encre); }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barre de démo */
.demo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--demo); color: #C9D2DD; font-size: .78rem; }
.demo .in { display: flex; gap: 8px 18px; align-items: center; flex-wrap: wrap; padding-block: 7px; }
.demo .tag { color: #8FA0B5; }
.demo .grp { display: flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; color: #C9D2DD; padding: 3px 11px; border-radius: 999px; font-size: .76rem; font-weight: 500; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--encre); }

/* Logo */
.logo { display: inline-flex; align-items: center; gap: 9px; font-family: var(--f-title); font-weight: 700; font-size: 1.05rem; color: inherit; text-decoration: none; letter-spacing: -.01em; }
.logo svg { flex: none; }

/* Coquille de l'app artisan */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 34px); background: linear-gradient(to right, var(--encre) 220px, transparent 220px); }
.side { background: var(--encre); color: #fff; display: flex; flex-direction: column; gap: 22px; padding: 20px 12px; position: sticky; top: calc(34px + env(safe-area-inset-top, 0px)); height: calc(100vh - 34px - env(safe-area-inset-top, 0px)); }
.side .logo { padding: 0 8px; }
.side nav { display: grid; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: #C9D2DD; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: .86rem; font-weight: 500; }
.side nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.side nav button[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
.side nav svg { flex: none; opacity: .9; }
.side .plan-card { margin-top: auto; background: rgba(255,255,255,.08); border-radius: 10px; padding: 12px; display: grid; gap: 2px; font-size: .78rem; color: #C9D2DD; }
.side .plan-card b { color: #fff; font-size: .82rem; }
.content { padding: 26px 32px 48px; min-width: 0; }
.content-in { max-width: 1160px; margin: 0 auto; display: grid; gap: 18px; }
.mhead { display: none; }
.tabbar { display: none; }

.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.pagehead .sub { font-size: .8rem; color: var(--muted); margin-bottom: 2px; }
.pagehead .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--encre); background: var(--surface); color: var(--encre); padding: 7px 13px; border-radius: 8px; font-size: .82rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--beton); }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--vert); border-color: var(--vert); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-size: .82rem; font-weight: 500; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.card-p { padding: 16px 18px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.kpi .k { font-size: .76rem; color: var(--muted); }
.kpi .v { font-family: var(--f-title); font-weight: 700; font-size: 1.6rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .v.warn { color: #9A5F06; }
.kpi .s { font-size: .72rem; color: var(--muted); }

.banner { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--ambre-soft); color: var(--ambre-ink); border-radius: 10px; padding: 10px 14px; font-size: .82rem; }
.banner b { color: #5E3C04; }
.banner .btn { border-color: var(--ambre-ink); color: var(--ambre-ink); background: transparent; }

.duo { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .72rem; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart { display: grid; gap: 12px; }
.crow { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; align-items: center; }
.crow .n { font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars { display: grid; gap: 4px; padding-right: 74px; }
.bar { position: relative; height: 7px; border-radius: 4px; }
.bar.prevu { background: var(--gris-barre); }
.bar.reel { background: var(--encre); }
.bar.reel.drift { background: var(--orange); }
.bar span { position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); font-size: .68rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar.reel span { color: var(--encre); font-weight: 600; }
.bar.reel.drift span { color: var(--orange); }
.chart-foot { font-size: .72rem; color: var(--muted); }

.navy { background: var(--encre); color: #fff; border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.navy h2 { color: #fff; }
.navy .big { font-family: var(--f-title); font-size: 2.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.navy p { font-size: .8rem; color: #D5DCE5; }
.navy .foot { margin-top: auto; font-size: .72rem; color: #A9B6C6; padding-top: 14px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th { text-align: left; font-size: .66rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: #F8F9FA; }
td b { font-weight: 600; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.mini { display: inline-flex; align-items: center; gap: 8px; }
.mini .t { width: 64px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.mini .t span { display: block; height: 100%; background: var(--orange); }
.chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: .7rem; font-weight: 600; white-space: nowrap; }
.chip.ok { background: var(--vert-soft); color: var(--vert); }
.chip.warn { background: var(--ambre-soft); color: var(--ambre-ink); }
.chip.wait { background: var(--orange-soft); color: var(--orange); }
.chip.idle { background: var(--beton); color: var(--muted); }
.mcards { display: none; }

/* Chantiers (liste) */
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.site { display: grid; gap: 10px; align-content: start; }
.site .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.site .top > div { min-width: 0; }
.site .meta { font-size: .8rem; color: var(--muted); }
.link { display: flex; align-items: center; gap: 6px; background: var(--beton); border-radius: 8px; padding: 4px 4px 4px 10px; min-width: 0; }
.link code { flex: 1; min-width: 0; font: .76rem ui-monospace, Menlo, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Journal (écran téléphone) */
.phone { max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.picker { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.picker button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .78rem; font-weight: 500; color: var(--muted); }
.picker button[aria-pressed="true"] { border-color: var(--encre); background: var(--encre); color: #fff; }
.sitecard { padding: 18px; display: grid; gap: 10px; }
.sitecard .t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sitecard h1 { font-size: 1.55rem; }
.sitecard .pct { font-family: var(--f-title); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.sitecard .where { color: var(--muted); font-size: .9rem; margin-top: -4px; }
.track { display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.track span { display: block; height: 100%; background: var(--orange); border-radius: 4px; transition: width .5s ease; }
.sitecard .stage { font-size: .9rem; }
.warnbox { display: flex; gap: 8px; align-items: center; background: var(--ambre-soft); color: #6B4505; border-radius: 10px; padding: 9px 12px; font-size: .88rem; font-weight: 500; }
.okbox { display: flex; gap: 8px; align-items: center; background: var(--vert-soft); color: var(--vert); border-radius: 10px; padding: 9px 12px; font-size: .88rem; font-weight: 500; }
.bigbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; background: var(--orange); color: #fff; border-radius: 14px; min-height: 56px; font-size: 1.05rem; font-weight: 600; box-shadow: 0 6px 16px rgba(194, 65, 12, .25); }
.bigbtn:hover { filter: brightness(1.06); }
.section-t { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.entry { padding: 14px 16px; display: grid; gap: 10px; }
.entry .eh { display: flex; justify-content: space-between; gap: 10px; font-size: .8rem; color: var(--muted); }
.entry p { font-size: .95rem; }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.photo { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--beton); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .stamp { position: absolute; left: 5px; bottom: 5px; font-size: .62rem; font-weight: 500; color: #fff; background: rgba(20, 38, 61, .7); padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.vu { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 500; color: var(--vert); }
.vu.no { color: var(--muted); }
.sys { padding: 14px 16px; display: flex; gap: 10px; align-items: center; font-size: .92rem; }
.sys svg { flex: none; }
.sys .btn { margin-left: auto; }

.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

/* Abonnement */
.planbox { display: grid; gap: 12px; max-width: 560px; }
.planbox .price { font-family: var(--f-title); font-weight: 700; font-size: 1.8rem; }
.planbox .price small { font-size: .9rem; font-weight: 500; color: var(--muted); font-family: var(--f-ui); }
.planbox ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }

/* Vue client */
.client { max-width: 720px; margin: 0 auto; padding-block: 18px 56px; display: grid; gap: 14px; }
.chead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chead .priv { display: inline-flex; gap: 6px; align-items: center; font-size: .76rem; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 4px 10px; }
.viewing { display: flex; gap: 8px 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--encre); color: #D5DCE5; border-radius: 10px; padding: 9px 14px; font-size: .8rem; }
.viewing b { color: #fff; }
.viewing select { border: 0; border-radius: 6px; padding: 3px 6px; color: var(--encre); background: #fff; max-width: 100%; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 9px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--encre); font-weight: 600; border-bottom-color: var(--orange); }
.tabs .n { font-size: .68rem; background: var(--orange); color: #fff; border-radius: 8px; padding: 0 6px; margin-left: 5px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 16px; }
.steps li:not(:last-child)::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.steps .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 600; border: 2px solid var(--line); background: var(--surface); color: var(--muted); }
.steps .validee .dot { background: var(--vert); border-color: var(--vert); color: #fff; }
.steps .a_valider .dot { border-color: var(--orange); color: var(--orange); }
.steps .en_cours .dot { border-color: var(--encre); color: var(--encre); border-style: dashed; }
.steps .sb { display: grid; gap: 4px; padding-top: 4px; }
.steps .st { display: flex; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.steps .sd { font-size: .8rem; color: var(--muted); }
.validate { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--orange-soft); border-radius: 10px; padding: 10px 12px; font-size: .84rem; margin-top: 4px; }
tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--line); }
.report { display: grid; gap: 12px; }
.mail { display: grid; gap: 2px; font-size: .8rem; color: var(--muted); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.mail b { color: var(--encre); font-weight: 600; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.figs div { background: var(--beton); border-radius: 10px; padding: 10px 12px; }
.figs b { display: block; font-family: var(--f-title); font-size: 1.35rem; }
.figs span { font-size: .74rem; color: var(--muted); }
.report ul { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; }

/* Nouvelle mise à jour */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(11, 23, 39, .5); display: grid; place-items: end center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .overlay { place-items: center; } }
.sheet { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 16px; }
.sheet form { display: grid; gap: 14px; padding: 18px; }
.sheet .sh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.timer { font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--orange-soft); color: var(--orange); font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 5px; }
.field > label, .field > .fl { font-size: .78rem; font-weight: 600; }
.field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--beton); }
.field textarea { resize: vertical; min-height: 76px; }
.field .hint { font-size: .72rem; color: var(--muted); }
.drop { position: relative; display: grid; place-items: center; gap: 2px; text-align: center; border: 1.5px dashed var(--gris-barre); border-radius: 10px; padding: 14px; font-size: .84rem; color: var(--muted); cursor: pointer; }
.drop:hover, .drop:focus-within { border-color: var(--orange); color: var(--orange); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .84rem; }
.check input { margin-top: 3px; accent-color: var(--orange); }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--encre); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .84rem; box-shadow: var(--shadow); width: max-content; max-width: calc(100% - 32px); }

@media (max-width: 1080px) {
  .duo { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .shell { display: block; background: none; }
  .side { display: none; }
  .content { padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .mhead { display: flex; justify-content: space-between; align-items: center; padding-block: 16px 6px; }
  .mhead .logo { font-size: 1.35rem; color: var(--encre); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--encre); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: .9rem; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; font-size: .74rem; color: var(--muted); padding: 4px 0; }
  .tabbar button[aria-current="page"] { color: var(--orange); font-weight: 600; }
  .pagehead .acts { display: none; }
  .tbl-desk { display: none; }
  .mcards { display: grid; gap: 0; }
  .mcard { display: grid; gap: 6px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); text-align: left; background: none; width: 100%; }
  .mcard:last-child { border-bottom: 0; }
  .mcard .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .mcard .l2 { font-size: .78rem; color: var(--muted); }
  .banner { grid-template-columns: auto 1fr; }
  .banner .btn { grid-column: 2; justify-self: start; }
  .crow { grid-template-columns: 6.2rem minmax(0, 1fr); }
  .sites { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 460px) {
  .figs { grid-template-columns: minmax(0, 1fr); }
  .demo .tag { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="demo gutter">
  <div class="in">
    <span class="tag">Prototype · données d'exemple</span>
    <div class="grp"><span>Marché</span>

  const fullName = (c) => `${c.nom} — ${c.lieu.split(",")[0]}`;

  function progress(c) {
    const tot = c.etapes.reduce((a, e) => a + e.prevu, 0);
    const done = c.etapes.reduce((a, e) => a + (e.statut === "validee" || e.statut === "a_valider" ? e.prevu : e.statut === "en_cours" ? Math.min(e.reel, e.prevu * 0.9) * 0.9 : 0), 0);

  const running = (c) => c.etapes.find((e) => e.statut === "en_cours");

  function health(c) {

    return [{ type: "Devis", ref: "D-2026-" + (100 + c.id.length * 7), lib: "Travaux " + c.nom.toLowerCase(), montant: c.budget, statut: "Signé", j: 40 }, { type: "Facture", ref: "F-2026-" + (200 + c.id.length * 5), lib: "Acompte 30 %", montant: Math.round(c.budget * 0.3), statut: "Payée", j: 30 }];
  }
  function lastMonday() { const d = new Date(NOW); d.setHours(8, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); if (d > NOW) d.setDate(d.getDate() - 7); return d; }
  const photoSrc = (c, ph) => (typeof ph === "string" ? ph : scene(c.type, ph[0], ph[1]));

  /* ---------- Coquille artisan ---------- */
  const NAV = [["tableau-de-bord", "Tableau de bord", "dash"], ["chantiers", "Chantiers", "home"], ["journal", "Journal", "list"], ["clients", "Clients", "users"], ["abonnement", "Abonnement", "card"]];
  const TABS = [["tableau-de-bord", "Chantiers", "home"], ["journal", "Journal", "list"], ["photos", "Photos", "photo"], ["abonnement", "Compte", "user"]];
  const TRIAL_LEFT = 41;

  function renderArtisan() {
    const m = M(), sec = state.section;
    const body = { "tableau-de-bord": secDashboard, chantiers: secChantiers, journal: secJournal, photos: secPhotos, clients: secClients, abonnement: secAbonnement }[sec]();
    const tabActive = (k) => sec === k || (k === "tableau-de-bord" && (sec === "chantiers" || sec === "clients"));
    $("#app").innerHTML = `<div class="shell">
      <aside class="side">
        <a class="logo" href="#tableau-de-bord">${LOGO_DARK(24)} Archfield</a>
        <nav aria-label="Menu">${NAV.map(([k, l, i]) => `<button type="button" data-section="${k}" ${sec === k ? 'aria-current="page"' : ""}>${ic(i, 17)} ${l}</button>`).join("")}</nav>
        <div class="plan-card"><b>Offre Équipe</b><span>Essai gratuit : encore ${TRIAL_LEFT} jours</span></div>
      </aside>
      <div class="content">
        <div class="mhead"><span class="logo">${LOGO(30)} Archfield</span><span class="avatar" title="${esc(m.artisan.contact)}">${m.artisan.init}</span></div>
        <div class="content-in">${body}</div>
      </div>
      <nav class="tabbar" aria-label="Onglets">${TABS.map(([k, l, i]) => `<button type="button" data-section="${k}" ${tabActive(k) ? 'aria-current="page"' : ""}>${ic(i, 24)}<span>${l}</span></button>`).join("")}</nav>
    </div>`;
  }

  function secDashboard() {
    const m = M(), hs = m.chantiers.map((c) => ({ c, h: health(c) }));
    const drifts = hs.filter((x) => x.h.drift), act = hs.filter((x) => x.h.r);
    const ecMoy = act.reduce((a, x) => a + x.h.ecart, 0) / Math.max(1, act.length);
    const max = Math.max(...m.duree.map(([, p, r]) => Math.max(p, r))) * 1.05;
    const chart = m.duree.map(([n, p, r]) => {
      const over = r > p * 1.2;
      return `<div class="crow"><span class="n">${esc(n)}</span><div class="bars">
        <div class="bar prevu" style="width:${(p / max) * 100}%"><span>${nf(p)}</span></div>
        <div class="bar reel ${over ? "drift" : ""}" style="width:${(r / max) * 100}%"><span>${nf(r)}${over ? ` (+${Math.round(((r - p) / p) * 100)} %)` : ""}</span></div>
      </div></div>`;
    }).join("");
    const ecartTxt = (h) => (h.r ? (h.r.reel > h.r.prevu ? "+" + nf(h.r.reel - h.r.prevu) : "0") + " j" : "—");
    const rows = hs.map(({ c, h }) => { const p = progress(c); return `<tr class="click" data-open-journal="${c.id}"><td><b>${esc(fullName(c))}</b></td><td>${esc(c.client)}</td>
      <td><span class="mini"><span class="t"><span style="width:${p}%"></span></span><span class="num">${p} %</span></span></td>
      <td>${h.r ? esc(h.r.nom) : "—"}</td><td class="num">${ecartTxt(h)}</td><td>${statusChip(h)}</td></tr>`; }).join("");
    const mcards = hs.map(({ c, h }) => { const p = progress(c); return `<button type="button" class="mcard" data-open-journal="${c.id}">
      <span class="l1"><b>${esc(fullName(c))}</b>${statusChip(h)}</span><span class="track"><span style="width:${p}%"></span></span>
      <span class="l2">${esc(c.client)} · ${p} % · ${h.r ? esc(h.r.nom) + " (" + ecartTxt(h) + ")" : "—"}</span></button>`; }).join("");
    return `
      <div class="pagehead"><div><p class="sub">${esc(m.artisan.nom)} · ${esc(m.artisan.ville)}</p><h1>Tableau de bord</h1></div>
        <div class="acts"><span class="pill">${ic("cal", 15)} ${cap(fmt(NOW, { month: "long", year: "numeric" }))}</span><button type="button" class="btn" data-export>Exporter en CSV</button></div></div>
      <div class="kpis">
        <div class="card kpi"><span class="k">Chantiers actifs</span><span class="v">${m.chantiers.length}</span><span class="s">${m.chantiers.filter((c) => progress(c) < 25).length} en démarrage</span></div>
        <div class="card kpi"><span class="k">Alertes de dérive</span><span class="v ${drifts.length ? "warn" : ""}">${drifts.length}</span><span class="s">Étapes à plus de 20 % du prévu</span></div>
        <div class="card kpi"><span class="k">Écart moyen</span><span class="v">${ecMoy >= 0 ? "+" : ""}${nf(Math.round(ecMoy * 10) / 10)} j</span><span class="s">Par étape en cours</span></div>
        <div class="card kpi"><span class="k">Rapports lus par les clients</span><span class="v">${m.lus} %</span><span class="s">Sur les 4 dernières semaines</span></div>
      </div>
      ${drifts.map(({ c, h }) => `<div class="banner">${ic("warn", 18)}<div><b>${esc(fullName(c))} : ${esc(h.r.nom.toLowerCase())}, dérive</b><br>${nf(h.r.reel)} jours au lieu de ${nf(h.r.prevu)} prévus, soit ${h.pctOver} % de plus. Prévenez ${esc(c.court)} avant le rapport de lundi.</div><button type="button" class="btn" data-publish="${c.id}">Prévenir</button></div>`).join("")}
      <div class="duo">
        <section class="card card-p"><div class="card-h"><h2>Durée par type d'étape, en jours</h2>
          <div class="legend"><span><i style="background:var(--gris-barre)"></i>Prévu</span><span><i style="background:var(--encre)"></i>Réel</span><span><i style="background:var(--orange)"></i>Réel, +20 % ou plus</span></div></div>
          <div class="chart">${chart}<p class="chart-foot">Moyenne sur les chantiers des 12 derniers mois.</p></div></section>
        <section class="navy"><h2>Indice de fiabilité</h2><span class="big">${m.fiab.pct} %</span>
          <p>des étapes livrées dans les délais, sur ${m.fiab.livres} chantiers terminés.</p>
          <p class="foot">Affiché sur votre profil public pour rassurer vos futurs clients.</p></section>
      </div>
      <section class="card card-p"><div class="card-h"><h2>Chantiers en cours</h2></div>
        <div class="tbl-wrap tbl-desk"><table><thead><tr><th>Chantier</th><th>Client</th><th>Avancement</th><th>Étape en cours</th><th>Écart</th><th>Statut</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="mcards">${mcards}</div></section>`;
  }

  function secChantiers() {
    const m = M();
    return `<div class="pagehead"><div><p class="sub">${m.chantiers.length} chantiers actifs</p><h1>Chantiers</h1></div>
      <div class="acts"><button type="button" class="btn primary" data-publish="">${ic("cam", 16)} Nouvelle mise à jour</button></div></div>
      <div class="sites">${m.chantiers.map((c) => { const h = health(c), p = progress(c); return `<div class="card card-p site">
        <div class="top"><div><h2>${esc(fullName(c))}</h2><p class="meta">${esc(c.client)} · suit depuis ${esc(c.clientVille)}</p></div>${statusChip(h)}</div>
        <span class="track"><span style="width:${p}%"></span></span>
        <p class="meta">${p} % · ${h.r ? "Étape en cours : " + esc(h.r.nom) : "Aucune étape en cours"}</p>
        <div class="link"><code>archfield.app/c/${esc(c.id)}</code><button type="button" class="btn ghost" data-copy="archfield.app/c/${esc(c.id)}">Copier le lien</button></div>
        <div class="row-acts"><button type="button" class="btn ghost" data-open-client="${c.id}">Voir comme le client</button><button type="button" class="btn ghost" data-open-journal="${c.id}">Journal</button></div>
      </div>`; }).join("")}</div>`;
  }

  const picker = () => `<div class="picker" role="group" aria-label="Chantier">${M().chantiers.map((c) => `<button type="button" data-pick="${c.id}" aria-pressed="${c.id === state.chantier[state.market]}">${esc(fullName(c))}</button>`).join("")}</div>`;
  function siteCard(c, forClient) {
    const h = health(c), p = progress(c), r = h.r, idx = r ? c.etapes.indexOf(r) : -1;
    return `<section class="card sitecard">
      <div class="t"><h1>${esc(c.nom)}</h1><span class="pct">${p} %</span></div>
      <p class="where">${esc(c.lieu)} · ${forClient ? "Réalisé par " + esc(M().artisan.nom) : "Client : " + esc(c.client)}</p>
      <span class="track"><span style="width:${p}%"></span></span>
      <p class="stage">${r ? `Étape ${idx + 1} sur ${c.etapes.length} : ${esc(r.nom.toLowerCase())}` : "Aucune étape en cours"}</p>
      ${h.ecart >= 1 ? `<div class="warnbox">${ic("warn", 18)} ${esc(r.nom)} : ${nf(h.ecart)} jour${h.ecart >= 2 ? "s" : ""} de retard sur le prévu</div>` : r ? `<div class="okbox">${ic("check", 18)} Dans les temps</div>` : ""}
    </section>`;
  }
  function entries(c, forClient) {
    const who = forClient ? "vous" : c.court;
    return c.journal.map((j) => {
      const st = c.etapes[j.etape];
      if (j.sys) {
        const waiting = st.statut === "a_valider";
        return `<div class="card sys">${ic("check", 22, waiting ? "var(--orange)" : "var(--vert)")}<span>${esc(st.nom)} terminé · ${waiting ? "en attente de validation par " : "validé par "}${esc(who)}</span>${forClient && waiting ? `<button type="button" class="btn ok" data-validate="${j.etape}">Valider</button>` : ""}</div>`;
      }
      const v = vuDate(j);
      return `<article class="card entry">
        <div class="eh"><span>${rel(j.d)}</span><span>${esc(st.nom)}</span></div>
        <p>${esc(j.t)}</p>
        ${j.photos.length ? `<div class="photos">${j.photos.map((ph) => `<div class="photo"><img alt="Photo du chantier, ${esc(st.nom)}" src="${photoSrc(c, ph)}"><span class="stamp">${dShort(j.d)} ${time(j.d)}</span></div>`).join("")}</div>` : ""}
        ${forClient ? "" : v ? `<span class="vu">${ic("eye", 17)} Vu par ${esc(c.court)} à ${time(v)}</span>` : `<span class="vu no">${ic("eye", 17)} Pas encore vu par ${esc(c.court)}</span>`}
      </article>`;
    }).join("");
  }
  function secJournal() {
    const c = current();
    return `<div class="phone">${picker()}${siteCard(c, false)}
      <button type="button" class="bigbtn" data-publish="${c.id}">${ic("cam", 22)} Nouvelle mise à jour</button>
      <h2 class="section-t">Journal du chantier</h2>${entries(c, false)}</div>`;
  }
  function secPhotos() {
    const c = current();
    const all = c.journal.filter((j) => !j.sys).flatMap((j) => j.photos.map((ph) => ({ ph, j })));
    return `<div class="pagehead"><div><p class="sub">${all.length} photos datées</p><h1>Photos</h1></div></div>${picker()}
      <div class="gallery">${all.map(({ ph, j }) => `<div class="photo"><img alt="Photo, ${esc(c.etapes[j.etape].nom)}" src="${photoSrc(c, ph)}"><span class="stamp">${dShort(j.d)} · ${esc(c.etapes[j.etape].nom)}</span></div>`).join("") || '<p class="muted">Aucune photo pour ce chantier.</p>'}</div>`;
  }
  function secClients() {
    const m = M();
    return `<div class="pagehead"><div><p class="sub">Accès par lien privé, sans compte</p><h1>Clients</h1></div></div>
      <section class="card card-p"><div class="tbl-wrap"><table><thead><tr><th>Client</th><th>Chantier</th><th>Suit depuis</th><th>Dernière visite</th><th class="r">Rapports lus</th><th></th></tr></thead><tbody>
      ${m.chantiers.map((c) => { const vs = c.journal.map(vuDate).filter(Boolean).sort((a, b) => b - a); return `<tr><td><b>${esc(c.client)}</b></td><td>${esc(fullName(c))}</td><td>${esc(c.clientVille)}</td><td>${vs[0] ? rel(vs[0]) : "Pas encore"}</td><td class="r">${c.rapportsLus}</td><td><button type="button" class="btn ghost" data-copy="archfield.app/c/${esc(c.id)}">Copier le lien</button></td></tr>`; }).join("")}
      </tbody></table></div></section>`;
  }
  function secAbonnement() {
    const m = M();
    return `<div class="pagehead"><div><p class="sub">${esc(m.artisan.nom)} · ${esc(m.artisan.contact)}</p><h1>Abonnement</h1></div></div>
      <section class="card card-p planbox">
        <div class="card-h" style="margin:0"><h2>Offre Équipe</h2><span class="chip wait">Essai gratuit : encore ${TRIAL_LEFT} jours</span></div>
        <span class="track"><span style="width:${Math.round(((61 - TRIAL_LEFT) / 61) * 100)}%"></span></span>
        <p>2 mois offerts, puis :</p>
        <div class="price">${m.prix} <small>par mois, sans engagement</small></div>
        <ul><li>Chantiers et clients illimités</li><li>Un lien privé par client, sans compte</li><li>Rapport automatique chaque lundi</li><li>Alertes de dérive et indice de fiabilité</li></ul>
        <p class="muted" style="font-size:.8rem">Votre client ne paie rien. Archfield vous sert d'argument pour rassurer et signer de nouveaux chantiers.</p>
      </section>
      <section class="navy" style="max-width:560px"><h2>Votre profil public</h2><span class="big">${m.fiab.pct} %</span><p>des étapes livrées dans les délais, sur ${m.fiab.livres} chantiers terminés. Calculé sur vos chantiers réels, pas sur des avis.</p></section>`;
  }

  /* ---------- Vue client ---------- */
  function renderClient() {
    const m = M(), c = current();
    // Le client ouvre son lien : les mises à jour passent en « vu ».
    c.journal.forEach((j) => { if (!j.sys && j.vu == null) j.vu = Math.max(0.02, (Date.now() - new Date(j.d).getTime()) / 36e5); });
    const toVal = c.etapes.filter((e) => e.statut === "a_valider").length;
    const tabs = [["journal", "Journal"], ["etapes", "Étapes", toVal], ["documents", "Devis et factures"], ["rapport", "Rapport du lundi"]];
    let body;
    if (state.tab === "journal") body = entries(c, true);
    else if (state.tab === "etapes") {
      body = `<section class="card card-p"><ol class="steps">${c.etapes.map((e, i) => {
        const late = e.statut === "en_cours" && e.reel > e.prevu;
        const d = e.statut === "validee" || e.statut === "a_valider" ? `${nf(e.reel)} j réalisés pour ${nf(e.prevu)} prévus` : e.statut === "en_cours" ? `En cours depuis ${nf(e.reel)} j, ${nf(e.prevu)} prévus` : `${nf(e.prevu)} j prévus`;
        const chip = late ? '<span class="chip warn">En retard</span>' : { validee: '<span class="chip ok">Validée</span>', a_valider: '<span class="chip wait">À valider</span>', en_cours: '<span class="chip idle">En cours</span>', a_venir: '<span class="chip idle">À venir</span>' }[e.statut];
        return `<li class="${e.statut}"><span class="dot">${e.statut === "validee" ? "✓" : i + 1}</span><div class="sb"><div class="st"><h3>${esc(e.nom)}</h3>${chip}</div><p class="sd">${d}</p>
          ${e.statut === "a_valider" ? `<div class="validate"><span>${esc(m.artisan.nom)} indique que cette étape est terminée. Regardez les photos du journal, puis validez.</span><button type="button" class="btn ok" data-validate="${i}">Valider l'étape</button></div>` : ""}</div></li>`;
      }).join("")}</ol></section>`;
    } else if (state.tab === "documents") {
      const docs = docsOf(c);
      const sum = (f) => docs.filter(f).reduce((a, d) => a + d.montant, 0);
      const devis = sum((d) => d.type === "Devis"), paye = sum((d) => d.statut === "Payée"), du = sum((d) => d.statut === "À régler");
      body = `<section class="card card-p"><div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Document</th><th>Objet</th><th class="r">Montant</th><th>Statut</th></tr></thead>
        <tbody>${docs.map((d) => `<tr><td class="num">${dShort(dAgo(d.j))}</td><td>${d.type} · ${esc(d.ref)}</td><td>${esc(d.lib)}</td><td class="r">${money(d.montant)}</td><td>${d.statut === "Payée" ? '<span class="chip ok">Payée</span>' : d.statut === "À régler" ? '<span class="chip warn">À régler</span>' : '<span class="chip idle">Signé</span>'}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="3">Total des devis signés</td><td class="r">${money(devis)}</td><td></td></tr><tr><td colspan="3" class="muted">Payé · reste à régler</td><td class="r">${money(paye)} · ${money(du)}</td><td></td></tr></tfoot>
      </table></div><p class="muted" style="font-size:.8rem;margin-top:10px">Vous avez payé ${Math.round((paye / devis) * 100)} % des devis pour ${progress(c)} % des travaux réalisés.</p></section>`;
    } else {
      const mon = lastMonday(), prev = new Date(mon.getTime() - 7 * 864e5);
      const wk = c.journal.filter((j) => !j.sys && new Date(j.d) >= prev && new Date(j.d) < mon);
      const ph = wk.reduce((a, j) => a + j.photos.length, 0);
      const h = health(c), next = c.etapes.find((e) => e.statut === "a_venir");
      const day = (d) => fmt(d, { weekday: "long", day: "numeric", month: "long" });
      body = `<section class="card card-p report">
        <div class="mail"><span>De : <b>Archfield</b> pour ${esc(m.artisan.nom)}</span><span>À : <b>${esc(c.client)}</b></span><span>Envoyé automatiquement le ${day(mon)} à 8 h 00</span></div>
        <h2>${esc(c.nom)} : votre semaine de chantier</h2>
        <div class="figs"><div><b>${progress(c)} %</b><span>des travaux réalisés</span></div><div><b>${wk.length}</b><span>mise${wk.length > 1 ? "s" : ""} à jour</span></div><div><b>${ph}</b><span>photos datées</span></div></div>
        <ul>${wk.map((j) => `<li><span class="muted">${dShort(j.d)}</span> · ${esc(j.t)}</li>`).join("") || "<li>Aucune mise à jour la semaine dernière. Votre artisan a été relancé automatiquement.</li>"}</ul>
        <p>${h.drift ? `<span class="chip warn">Dérive</span> ${esc(h.r.nom)} : ${nf(h.ecart)} j de retard.` : '<span class="chip ok">Dans les temps</span>'}${next ? ` Étape suivante : <b>${esc(next.nom)}</b>.` : ""}</p>
        <p class="muted" style="font-size:.8rem">Prochain rapport : ${day(new Date(mon.getTime() + 7 * 864e5))} à 8 h 00.</p></section>`;
    }
    $("#app").innerHTML = `<div class="client gutter">
      <div class="viewing"><span>Vous voyez le lien privé de <b>${esc(c.client)}</b>. Aucun compte nécessaire.</span>
        <label>Chantier <select id="client-site">${m.chantiers.map((x) => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(fullName(x))}</option>`).join("")}</select></label></div>
      <div class="chead"><span class="logo" style="color:var(--encre)">${LOGO(28)} Archfield</span><span class="priv">${ic("lock", 14)} Lien privé</span></div>
      ${siteCard(c, true)}
      <div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button type="button" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${state.tab === k}">${l}${n ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div>
      ${body}
    </div>`;
  }

  function render() {
    document.querySelectorAll("[data-market]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.market === state.market)));
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    state.view === "client" ? renderClient() : renderArtisan();
  }

  /* ---------- Nouvelle mise à jour ---------- */
  let timer = null, t0 = 0, uploads = [];
  function openComposer(id, keepText, keepTimer) {
    const m = M(), c = m.chantiers.find((x) => x.id === id) || current();
    uploads = [];
    if (!keepTimer) t0 = Date.now();
    const run = Math.max(0, c.etapes.findIndex((e) => e.statut === "en_cours"));
    const ov = $("#composer");
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cmp-title"><form id="cmp-form">
      <div class="sh"><h2 id="cmp-title">Nouvelle mise à jour</h2><span class="timer" id="cmp-timer">0 s</span></div>
      <div class="field"><label for="cmp-site">Chantier</label><select id="cmp-site">${m.chantiers.map((x) => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(fullName(x))} · ${esc(x.client)}</option>`).join("")}</select></div>
      <div class="field"><label for="cmp-step">Étape</label><select id="cmp-step">${c.etapes.map((e, i) => `<option value="${i}" ${i === run ? "selected" : ""} ${e.statut === "validee" ? "disabled" : ""}>${i + 1}. ${esc(e.nom)}${e.statut === "validee" ? " (validée)" : ""}</option>`).join("")}</select></div>
      <div class="field"><span class="fl">Photos</span>
        <label class="drop" for="cmp-photos"><input id="cmp-photos" type="file" accept="image/*" capture="environment" multiple>${ic("cam", 22)}<b>Prendre ou choisir des photos</b><span style="font-size:.72rem">Datées automatiquement. Sans photo, la démo en ajoute deux d'exemple.</span></label>
        <div class="thumbs" id="cmp-thumbs"></div></div>
      <div class="field"><label for="cmp-text">Une phrase pour ${esc(c.court)}</label>
        <textarea id="cmp-text" maxlength="160" required placeholder="Ex. : Murs de la chambre montés, on coule le chaînage samedi."></textarea><span class="hint" id="cmp-count">0 / 160</span></div>
      <label class="check"><input type="checkbox" id="cmp-done"><span>Étape terminée : demander à ${esc(c.court)} de la valider</span></label>
      <div class="acts"><button type="button" class="btn ghost" id="cmp-cancel">Annuler</button><button type="submit" class="btn primary">Publier</button></div>
    </form></div>`;
    ov.hidden = false;
    if (keepText) $("#cmp-text").value = keepText;
    $("#cmp-text").focus();
    clearInterval(timer);
    timer = setInterval(() => { const el = $("#cmp-timer"); if (el) el.textContent = Math.round((Date.now() - t0) / 1000) + " s"; }, 500);
    $("#cmp-site").addEventListener("change", (e) => openComposer(e.target.value, $("#cmp-text").value, true));
    $("#cmp-text").addEventListener("input", (e) => { $("#cmp-count").textContent = e.target.value.length + " / 160"; });
    $("#cmp-photos").addEventListener("change", (e) => {
      uploads = []; $("#cmp-thumbs").innerHTML = "";
      Array.from(e.target.files || []).slice(0, 8).forEach((f) => { const rd = new FileReader(); rd.onload = () => { uploads.push(rd.result); $("#cmp-thumbs").insertAdjacentHTML("beforeend", `<img alt="" src="${rd.result}">`); }; rd.readAsDataURL(f); });
    });
    $("#cmp-cancel").addEventListener("click", closeComposer);
    $("#cmp-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const site = m.chantiers.find((x) => x.id === $("#cmp-site").value);
      const idx = Number($("#cmp-step").value), st = site.etapes[idx], text = $("#cmp-text").value.trim();
      if (!text) return;
      const done = $("#cmp-done").checked, seed = Date.now() % 997, lvl = Math.min(idx, 5), nowIso = new Date().toISOString();
      if (st.statut === "a_venir") { site.etapes.forEach((x) => { if (x.statut === "en_cours") x.statut = "a_valider"; }); st.statut = "en_cours"; st.reel = 1; }
      if (done) { st.statut = "a_valider"; site.journal.unshift({ d: nowIso, etape: idx, sys: true }); }
      site.journal.splice(done ? 1 : 0, 0, { d: nowIso, etape: idx, t: text, photos: uploads.length ? uploads.slice() : [[lvl, seed], [lvl, seed + 3]], vu: null });
      const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
      closeComposer();
      state.chantier[state.market] = site.id;
      go("journal");
      toast(`Publié en ${secs} s. ${site.client} reçoit la mise à jour sur son lien.`);
    });
  }
  function closeComposer() { clearInterval(timer); $("#composer").hidden = true; $("#composer").innerHTML = ""; }

  let toastT = null;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800); }

  /* ---------- Navigation ---------- */
  const SECTIONS = ["tableau-de-bord", "chantiers", "journal", "photos", "clients", "abonnement"];
  function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else fromHash(); }
  function fromHash() {
    const h = location.hash.slice(1);
    if (h === "client") state.view = "client";
    else { state.view = "artisan"; state.section = SECTIONS.includes(h) ? h : isMobile() ? "journal" : "tableau-de-bord"; }
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", fromHash);

  function copy(text, ok) {
    try { navigator.clipboard.writeText(text).then(() => toast(ok), () => toast("La copie est bloquée ici. Sélectionnez le texte à la main.")); }
    catch (err) { toast("La copie est bloquée ici. Sélectionnez le texte à la main."); }
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button, a, tr[data-open-journal]");
    if (!b) return;
    const ds = b.dataset;
    if (ds.market) { state.market = ds.market; state.tab = "journal"; try { localStorage.setItem("archfield-market", state.market); } catch (err) {} render(); }
    else if (ds.view) { if (ds.view === "client") { state.tab = "journal"; go("client"); } else go(state.section); }
    else if (ds.section) go(ds.section);
    else if (ds.publish !== undefined) openComposer(ds.publish || state.chantier[state.market]);
    else if (ds.openJournal) { state.chantier[state.market] = ds.openJournal; go("journal"); }
    else if (ds.openClient) { state.chantier[state.market] = ds.openClient; state.tab = "journal"; go("client"); }
    else if (ds.pick) { state.chantier[state.market] = ds.pick; render(); }
    else if (ds.tab) { state.tab = ds.tab; renderClient(); }
    else if (ds.validate !== undefined) {
      const c = current(), i = Number(ds.validate), st = c.etapes[i];
      st.statut = "validee";
      const nxt = c.etapes[i + 1];
      if (nxt && nxt.statut === "a_venir" && !running(c)) { nxt.statut = "en_cours"; nxt.reel = 1; }
      if (!c.journal.some((j) => j.sys && j.etape === i)) c.journal.unshift({ d: new Date().toISOString(), etape: i, sys: true });
      renderClient();
      toast(`Étape « ${st.nom} » validée. ${M().artisan.nom} reçoit une notification.`);
    }
    else if (ds.copy) copy("https://" + ds.copy, "Lien copié. Envoyez-le au client par WhatsApp ou par e-mail.");
    else if (ds.export !== undefined) {
      const rows = [["Chantier", "Client", "Avancement", "Étape en cours", "Écart (j)", "Statut"]].concat(M().chantiers.map((c) => { const h = health(c); return [fullName(c), c.client, progress(c) + " %", h.r ? h.r.nom : "", h.ecart, h.drift ? "Dérive" : "Dans les temps"]; }));
      copy(rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n"), `CSV copié (${rows.length - 1} chantiers). Collez-le dans Excel ou Google Sheets.`);
    }
  });
  document.addEventListener("change", (e) => { if (e.target.id === "client-site") { state.chantier[state.market] = e.target.value; state.tab = "journal"; renderClient(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#composer").hidden) closeComposer(); });
  $("#composer").addEventListener("click", (e) => { if (e.target.id === "composer") closeComposer(); });

  fromHash();
})();
</script>
</body>
</html>
