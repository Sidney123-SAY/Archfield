<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archfield</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre d'outils de chantier en haut, puis soit le poste de l'artisan (tableau de bord + colonne latérale), soit le lien privé du client (colonne unique, lisible au téléphone). */
:root {
  --bg: #f2f3f1;
  --surface: #ffffff;
  --surface-2: #e8eae6;
  --ink: #1a1e22;
  --muted: #5a6168;
  --line: #d6d9d3;
  --accent: #2753b8;      /* bleu du cordeau de traçage */
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f8;
  --earth: #a94f27;       /* latérite */
  --ok: #2c7a4b;
  --ok-soft: #e1f0e6;
  --warn: #a8600a;
  --warn-soft: #f8ecd9;
  --crit: #b0372a;
  --crit-soft: #f8e1dd;
  --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 6px 20px rgba(20, 30, 40, .06);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2025; --surface-2: #262b31; --ink: #e6e8ea; --muted: #9aa2aa; --line: #30363d;
    --accent: #85a6ff; --accent-ink: #0f1520; --accent-soft: #1f2b47; --earth: #e08a5f;
    --ok: #63c48b; --ok-soft: #1a3325; --warn: #e8a64e; --warn-soft: #3a2a12; --crit: #f07d6c; --crit-soft: #3d1d18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2025; --surface-2: #262b31; --ink: #e6e8ea; --muted: #9aa2aa; --line: #30363d;
  --accent: #85a6ff; --accent-ink: #0f1520; --accent-soft: #1f2b47; --earth: #e08a5f;
  --ok: #63c48b; --ok-soft: #1a3325; --warn: #e8a64e; --warn-soft: #3a2a12; --crit: #f07d6c; --crit-soft: #3d1d18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.3rem); font-weight: 750; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 650; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }

/* Barre du haut */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-stretch: 110%; font-size: 1.15rem; letter-spacing: -.01em; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: .86rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg-label { font-size: .75rem; color: var(--muted); margin-right: 6px; }
.seg-group { display: flex; align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: .9rem; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: .82rem; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); font-weight: 600; }

main { padding-block: 24px 64px; }
.pitch { display: flex; gap: 8px 16px; align-items: baseline; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px dashed var(--line); margin-bottom: 24px; }
.pitch p { max-width: 70ch; color: var(--muted); font-size: .92rem; }
.pitch strong { color: var(--ink); font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-b { padding: 16px; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chip.idle { background: var(--surface-2); color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: .72rem; padding: 1px 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); white-space: nowrap; }

/* Artisan */
.art-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.art-head .who { display: grid; gap: 4px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.kpi .v { font-family: var(--f-display); font-weight: 750; font-stretch: 90%; font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.kpi .s { font-size: .8rem; color: var(--muted); }
.kpi.alert .v { color: var(--crit); }
.art-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: grid; gap: 20px; min-width: 0; }

.alert-row { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.alert-row:last-child { border-bottom: 0; }
.alert-row .stripe { align-self: stretch; border-radius: 2px; }
.alert-row .stripe.crit { background: var(--crit); }
.alert-row .stripe.warn { background: var(--warn); }
.alert-row p { font-size: .88rem; }

.site { display: grid; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
.site:last-child { border-bottom: 0; }
.site-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.site-top > div { min-width: 0; }
.site-meta { font-size: .84rem; color: var(--muted); }
.steps-bar { display: flex; gap: 3px; }
.steps-bar span { flex: 1; height: 8px; border-radius: 2px; background: var(--surface-2); }
.steps-bar span.done { background: var(--ok); }
.steps-bar span.wait { background: var(--accent); }
.steps-bar span.run { background: repeating-linear-gradient(135deg, var(--accent) 0 4px, var(--accent-soft) 4px 8px); }
.steps-bar span.late { background: repeating-linear-gradient(135deg, var(--crit) 0 4px, var(--crit-soft) 4px 8px); }
.site-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.link-box { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 220px; background: var(--surface-2); border-radius: var(--r); padding: 4px 4px 4px 10px; }
.link-box code { font-family: var(--f-mono); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }

.drift { display: grid; gap: 10px; }
.drift-row { display: grid; grid-template-columns: 9.5rem 1fr 3.4rem; gap: 10px; align-items: center; font-size: .84rem; }
.drift-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drift-track { position: relative; height: 14px; }
.drift-track::before { content: ""; position: absolute; left: 25%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.drift-bar { position: absolute; top: 2px; height: 10px; border-radius: 2px; }
.drift-bar.pos { left: 25%; background: var(--warn); }
.drift-bar.pos.hi { background: var(--crit); }
.drift-bar.neg { right: 75%; background: var(--ok); }
.drift-row .val { text-align: right; }
.drift-axis { display: grid; grid-template-columns: 9.5rem 1fr 3.4rem; gap: 10px; font-size: .7rem; color: var(--muted); }
.drift-axis .ticks { position: relative; height: 14px; }
.drift-axis .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

.score { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.gauge { width: 92px; height: 92px; }
.score dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .84rem; }
.score dt { color: var(--muted); }
.score dd { margin: 0; text-align: right; font-family: var(--f-mono); }

.plan { display: grid; gap: 10px; }
.plan .price { font-family: var(--f-display); font-weight: 750; font-size: 1.6rem; font-stretch: 90%; }
.plan .price small { font-size: .9rem; font-weight: 500; color: var(--muted); }
.trial { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.trial span { display: block; height: 100%; background: var(--accent); }

/* Client */
.client { max-width: 780px; margin: 0 auto; display: grid; gap: 20px; }
.viewing { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); color: var(--accent); border-radius: var(--r); padding: 10px 14px; font-size: .86rem; }
.viewing select { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; color: var(--ink); max-width: 100%; }
.cl-head { display: grid; gap: 14px; }
.cl-head .row { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; font-size: .86rem; color: var(--muted); }
.progress { display: grid; gap: 6px; }
.progress .bar { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress .bar span { display: block; height: 100%; background: var(--ok); border-radius: 6px; transition: width .5s ease; }
.progress .lbls { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: .72rem; background: var(--surface-2); padding: 0 6px; border-radius: 8px; margin-left: 4px; }

.journal { display: grid; gap: 0; }
.entry { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.entry:last-child { border-bottom: 0; }
.entry .when { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); line-height: 1.4; }
.entry .when b { display: block; font-size: 1.15rem; color: var(--ink); font-weight: 500; }
.entry .body { display: grid; gap: 10px; min-width: 0; }
.entry .body .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--muted); }
.entry.sys .body p { color: var(--muted); font-style: italic; }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.photo { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .stamp { position: absolute; left: 6px; bottom: 6px; font-family: var(--f-mono); font-size: .66rem; color: #fff; background: rgba(0,0,0,.55); padding: 1px 5px; border-radius: 3px; }

.stepper { list-style: none; margin: 0; padding: 0; display: grid; }
.stepper li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; position: relative; padding-bottom: 18px; }
.stepper li:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.stepper .num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: .8rem; font-weight: 500; border: 2px solid var(--line); background: var(--surface); color: var(--muted); }
.stepper .validee .num { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.stepper .a_valider .num { border-color: var(--accent); color: var(--accent); }
.stepper .en_cours .num { border-color: var(--accent); color: var(--accent); border-style: dashed; }
.stepper .step-b { display: grid; gap: 6px; padding-top: 4px; min-width: 0; }
.stepper .step-t { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.stepper .step-d { font-size: .82rem; color: var(--muted); }
.validate { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; font-size: .86rem; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 600; border-bottom: 0; }

.report { display: grid; gap: 14px; }
.mail-h { display: grid; gap: 2px; font-size: .84rem; color: var(--muted); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.mail-h b { color: var(--ink); font-weight: 600; }
.report ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.report .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.report .figs div { background: var(--surface-2); border-radius: var(--r); padding: 10px 12px; }
.report .figs b { display: block; font-family: var(--f-display); font-size: 1.4rem; font-stretch: 90%; }
.report .figs span { font-size: .78rem; color: var(--muted); }

/* Publication */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 20, .5); display: grid; place-items: end center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .overlay { place-items: center; } }
.sheet { width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }
.sheet form { display: grid; gap: 14px; padding: 18px; }
.sheet .sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.timer { font-family: var(--f-mono); font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.field { display: grid; gap: 5px; }
.field label, .field .lbl { font-size: .8rem; font-weight: 600; }
.field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--bg); }
.field textarea { resize: vertical; min-height: 72px; }
.field .hint { font-size: .76rem; color: var(--muted); }
.drop { display: grid; place-items: center; gap: 4px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; font-size: .86rem; color: var(--muted); }
.drop:hover, .drop:focus-within { border-color: var(--accent); color: var(--accent); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; display: block; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; }
.check input { margin-top: 4px; }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-size: .88rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 900px) {
  .art-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .entry { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .entry .when b { display: inline; font-size: .9rem; margin-right: 6px; }
  .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .report .figs { grid-template-columns: minmax(0, 1fr); }
  .drift-row, .drift-axis { grid-template-columns: 6.5rem 1fr 3rem; }
  .seg button { padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top gutter">
  <div class="wrap">
    <a class="brand" href="#artisan" aria-label="Archfield, accueil">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="5" fill="var(--accent)"/><path d="M5 19 L13 6 L21 19" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linejoin="round"/><path d="M8.5 14 H17.5" stroke="var(--accent-ink)" stroke-width="2"/></svg>
      Archfield
    </a>
    <div class="spacer"></div>
    <div class="seg-group"><span class="seg-label">Marché</span>
      <div class="seg" role="group" aria-label="Marché">
        <button type="button" id="mk-af" data-market="af">Afrique de l'Ouest</button>
        <button type="button" id="mk-eu" data-market="eu">Europe</button>
      </div>
    </div>
    <div class="seg-group"><span class="seg-label">Vue</span>
      <div class="seg" role="group" aria-label="Vue">
        <button type="button" id="vw-artisan" data-view="artisan">Artisan</button>
        <button type="button" id="vw-client" data-view="client">Client</button>
      </div>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="wrap">
    <div class="pitch">
      <span class="eyebrow">Prototype · données d'exemple</span>
      <p><strong>Archfield permet à n'importe quel client de suivre son chantier à distance, en toute transparence, et transforme chaque chantier en données utiles.</strong> Publiez une mise à jour côté artisan, puis basculez sur la vue client pour la voir arriver.</p>
    </div>
    <div id="app"></div>
  </div>
</main>

<div class="overlay" id="composer" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- Photos d'exemple : scènes de chantier dessinées en SVG ---------- */
  function rnd(seed) { let s = seed * 9301 + 49297; return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  function scene(kind, level, seed) {
    const r = rnd(seed);
    const W = 320, H = 240;
    let g = "";
    if (kind === "ext") {
      const sky = ["#9cc3e6", "#b9d3ea", "#e9c99a"][seed % 3];
      g += `<rect width="${W}" height="${H}" fill="${sky}"/>`;

          <section class="panel"><div class="panel-h"><h2>Où vous perdez du temps</h2></div>
            <div class="panel-b drift">
              <p class="muted" style="font-size:.82rem">Écart moyen entre durée réelle et durée prévue, par étape, sur vos ${f.livres} derniers chantiers.</p>
              ${driftHtml}
              <div class="drift-axis" aria-hidden="true"><span></span><div class="ticks"><span style="left:0">−10 %</span><span style="left:25%">0</span><span style="left:50%">+10 %</span><span style="left:100%;transform:translateX(-100%)">+30 %</span></div><span></span></div>
            </div>
          </section>
          <section class="panel"><div class="panel-h"><h2>Abonnement</h2><span class="chip info">Essai gratuit</span></div>
            <div class="panel-b plan">
              <div class="trial" aria-label="Essai : 16 jours écoulés sur 61"><span style="width:26%"></span></div>
              <p style="font-size:.86rem">2 mois offerts, jusqu'au ${dLong(m.essaiFin)}. Ensuite :</p>
              <div class="price">${m.prix} <small>/ mois, sans engagement</small></div>
              <p class="muted" style="font-size:.82rem">Votre client ne paie rien et n'a pas besoin de compte. Archfield vous sert d'argument pour rassurer et signer de nouveaux chantiers.</p>
            </div>
          </section>
        </div>
      </div>`;
  }

  /* ---------- Rendu : client ---------- */
  function renderClient() {
    const m = M(), c = current(), h = health(c);
    const p = progress(c);
    const toValidate = c.etapes.filter((e) => e.statut === "a_valider").length;
    const tabs = [["journal", "Journal", c.journal.length], ["etapes", "Étapes", toValidate || ""], ["documents", "Devis et factures", c.docs.length], ["rapport", "Rapport du lundi", ""]];
    let body = "";

    if (state.tab === "journal") {
      body = `<div class="journal">${c.journal.map((j) => `
        <article class="entry ${j.sys ? "sys" : ""}">
          <div class="when"><b>${dDay(j.d)} ${dMon(j.d)}</b>${dTime(j.d)}</div>
          <div class="body">
            <div class="meta"><span class="tag">${esc(c.etapes[j.etape].nom)}</span>${j.sys ? "" : `<span>par ${esc(m.artisan.contact)}</span>`}</div>
            <p>${esc(j.t)}</p>
            ${j.photos && j.photos.length ? `<div class="photos">${j.photos.map((ph) => `<div class="photo"><img alt="Photo du chantier, ${esc(c.etapes[j.etape].nom)}" src="${photoSrc(c, ph)}"><span class="stamp">${dShort(j.d)} ${dTime(j.d)}</span></div>`).join("")}</div>` : ""}
          </div>
        </article>`).join("")}</div>`;
    } else if (state.tab === "etapes") {
      let start = new Date(c.debut);
      body = `<ol class="stepper">${c.etapes.map((e, i) => {
        const d0 = new Date(start); start = new Date(start.getTime() + (e.reel && e.statut !== "en_cours" ? e.reel : e.prevu) * 864e5);
        const dur = e.statut === "validee" || e.statut === "a_valider" ? `${e.reel} j réalisés pour ${e.prevu} prévus` : e.statut === "en_cours" ? `En cours depuis ${e.reel} j, ${e.prevu} prévus` : `${e.prevu} j prévus, début vers le ${dShort(d0)}`;
        const late = e.statut === "en_cours" && e.reel > e.prevu;
        return `<li class="${e.statut}">
          <span class="num">${e.statut === "validee" ? "✓" : i + 1}</span>
          <div class="step-b">
            <div class="step-t"><h3>${esc(e.nom)}</h3>${late ? '<span class="chip crit">En retard</span>' : statutChip(e.statut)}</div>
            <p class="step-d">${dur}</p>
            ${e.statut === "a_valider" ? `<div class="validate"><span>${esc(m.artisan.contact)} indique que cette étape est terminée. Vérifiez les photos du journal, puis validez.</span><button class="btn small ok" type="button" data-validate="${i}">Valider l'étape</button></div>` : ""}
          </div></li>`;
      }).join("")}</ol>`;
    } else if (state.tab === "documents") {
      const devis = c.docs.filter((d) => d.type === "Devis").reduce((a, d) => a + d.montant, 0);
      const paye = c.docs.filter((d) => d.statut === "Payée").reduce((a, d) => a + d.montant, 0);
      const du = c.docs.filter((d) => d.statut === "À régler").reduce((a, d) => a + d.montant, 0);
      body = `<div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Document</th><th>Objet</th><th class="num">Montant</th><th>Statut</th></tr></thead>
        <tbody>${c.docs.map((d) => `<tr><td class="mono">${dShort(d.date)}</td><td>${d.type} <span class="tag">${esc(d.ref)}</span></td><td>${esc(d.lib)}</td><td class="num">${money(d.montant)}</td><td>${d.statut === "Payée" ? '<span class="chip ok">Payée</span>' : d.statut === "À régler" ? '<span class="chip warn">À régler</span>' : '<span class="chip info">Signé</span>'}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="3">Total des devis signés</td><td class="num">${money(devis)}</td><td></td></tr>
        <tr><td colspan="3" class="muted">Déjà payé · reste à régler</td><td class="num">${money(paye)} · ${money(du)}</td><td></td></tr></tfoot>
      </table></div>
      <p class="muted" style="font-size:.82rem;margin-top:12px">Payé : ${Math.round((paye / devis) * 100)} % du montant des devis, pour ${p} % des travaux réalisés.</p>`;
    } else {
      const since = new Date("2026-10-19T00:00"), until = new Date("2026-10-26T08:00");
      const wk = c.journal.filter((j) => new Date(j.d) >= since && new Date(j.d) < until && !j.sys);
      const ph = wk.reduce((a, j) => a + (j.photos ? j.photos.length : 0), 0);
      const next = c.etapes.find((e) => e.statut === "en_cours" || e.statut === "a_venir");
      body = `<div class="report">
        <div class="mail-h"><span>De : <b>Archfield</b> pour ${esc(m.artisan.nom)}</span><span>À : <b>${esc(c.client)}</b></span><span>Envoyé automatiquement le lundi 26 octobre 2026 à 8 h 00</span></div>
        <h2>${esc(c.nom)} : votre semaine de chantier</h2>
        <div class="figs"><div><b>${p} %</b><span>des travaux réalisés</span></div><div><b>${wk.length}</b><span>mise${wk.length > 1 ? "s" : ""} à jour publiée${wk.length > 1 ? "s" : ""}</span></div><div><b>${ph}</b><span>photos datées</span></div></div>
        <ul>${wk.map((j) => `<li><span class="mono muted">${dShort(j.d)}</span> · ${esc(j.t)}</li>`).join("") || "<li>Aucune mise à jour cette semaine. Votre artisan a été relancé automatiquement.</li>"}</ul>
        <p>Santé du chantier : <span class="chip ${h.cls}">${h.lbl}</span>${next ? ` · Étape suivante : <b>${esc(next.nom)}</b>` : ""}</p>
        <p class="muted" style="font-size:.82rem">Prochain rapport : lundi 2 novembre 2026 à 8 h 00.</p>
      </div>`;
    }

    $("#app").innerHTML = `<div class="client">
      <div class="viewing"><span>Vous voyez le lien privé de <b>${esc(c.client)}</b>, sans compte.</span>
        <label>Chantier <select id="client-site">${m.chantiers.map((x) => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(x.nom)}</option>`).join("")}</select></label></div>
      <section class="cl-head">
        <span class="eyebrow">${esc(c.lieu)} · suivi depuis ${esc(c.clientVille)}</span>
        <h1>${esc(c.nom)}</h1>
        <div class="row"><span>Réalisé par <b style="color:var(--ink)">${esc(m.artisan.nom)}</b></span><span class="chip ${h.cls}">${h.lbl}</span><span>Dernière photo : ${dShort(c.journal[0].d)} à ${dTime(c.journal[0].d)}</span></div>
        <div class="progress"><div class="bar"><span style="width:${p}%"></span></div>
          <div class="lbls"><span>${c.etapes.filter((e) => e.statut === "validee").length} étapes validées sur ${c.etapes.length}</span><span class="mono">${p} %</span></div></div>
      </section>
      <div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button type="button" role="tab" id="tab-${k}" aria-selected="${state.tab === k}" data-tab="${k}">${l}${n !== "" ? `<span class="count">${n}</span>` : ""}</button>`).join("")}</div>
      <section class="panel"><div class="panel-b">${body}</div></section>
    </div>`;
  }

  function render() {
    renderTop();
    state.view === "client" ? renderClient() : renderArtisan();
  }

  /* ---------- Publication en 30 secondes ---------- */
  let timer = null, t0 = 0, uploads = [];
  function openComposer(id) {
    const m = M(), c = m.chantiers.find((x) => x.id === id) || m.chantiers[0];
    uploads = []; t0 = Date.now();
    const runIdx = Math.max(0, c.etapes.findIndex((e) => e.statut === "en_cours"));
    const ov = $("#composer");
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cmp-title"><form id="cmp-form">
      <div class="sheet-h"><h2 id="cmp-title">Publier l'avancement</h2><span class="timer" id="cmp-timer">0 s</span></div>
      <div class="field"><label for="cmp-site">Chantier</label><select id="cmp-site">${m.chantiers.map((x) => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(x.nom)} · ${esc(x.client)}</option>`).join("")}</select></div>
      <div class="field"><label for="cmp-step">Étape</label><select id="cmp-step">${c.etapes.map((e, i) => `<option value="${i}" ${i === runIdx ? "selected" : ""} ${e.statut === "validee" ? "disabled" : ""}>${i + 1}. ${esc(e.nom)}${e.statut === "validee" ? " (validée)" : ""}</option>`).join("")}</select></div>
      <div class="field"><span class="lbl">Photos</span>
        <label class="drop" for="cmp-photos"><input id="cmp-photos" type="file" accept="image/*" capture="environment" multiple>
          <span><b>Prendre ou choisir des photos</b></span><span style="font-size:.76rem">Elles sont datées automatiquement. Sans photo, on utilise des photos d'exemple.</span></label>
        <div class="thumbs" id="cmp-thumbs"></div></div>
      <div class="field"><label for="cmp-text">Une phrase pour le client</label>
        <textarea id="cmp-text" maxlength="160" placeholder="Ex. : Tôles posées sur la moitié du toit, fin prévue jeudi." required></textarea>
        <span class="hint" id="cmp-count">0 / 160</span></div>
      <label class="check"><input type="checkbox" id="cmp-done"><span>Étape terminée : demander au client de la valider</span></label>
      <div class="actions"><button class="btn" type="button" id="cmp-cancel">Annuler</button><button class="btn primary" type="submit">Publier</button></div>
    </form></div>`;
    ov.hidden = false;
    $("#cmp-text").focus();
    clearInterval(timer);
    timer = setInterval(() => { const el = $("#cmp-timer"); if (el) el.textContent = Math.round((Date.now() - t0) / 1000) + " s"; }, 500);

    $("#cmp-site").addEventListener("change", (e) => { const txt = $("#cmp-text").value; openComposer(e.target.value); $("#cmp-text").value = txt; });
    $("#cmp-text").addEventListener("input", (e) => { $("#cmp-count").textContent = e.target.value.length + " / 160"; });
    $("#cmp-photos").addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []).slice(0, 8);
      uploads = [];
      $("#cmp-thumbs").innerHTML = "";
      files.forEach((f) => {
        const rd = new FileReader();
        rd.onload = () => { uploads.push(rd.result); $("#cmp-thumbs").insertAdjacentHTML("beforeend", `<img alt="" src="${rd.result}">`); };
        rd.readAsDataURL(f);
      });
    });
    $("#cmp-cancel").addEventListener("click", closeComposer);
    $("#cmp-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const site = m.chantiers.find((x) => x.id === $("#cmp-site").value);
      const idx = Number($("#cmp-step").value), step = site.etapes[idx];
      const text = $("#cmp-text").value.trim();
      if (!text) return;
      const lvl = Math.min(idx, 4);
      const photos = uploads.length ? uploads.slice() : [[lvl, Date.now() % 997], [lvl, (Date.now() + 7) % 997]];
      site.journal.unshift({ d: new Date().toISOString(), etape: idx, t: text, photos });
      if (step.statut === "a_venir") { step.statut = "en_cours"; step.reel = 1; }
      if ($("#cmp-done").checked) { step.statut = "a_valider"; step.reel = step.reel || step.prevu; }
      const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
      closeComposer();
      state.chantier[state.market] = site.id;
      render();
      toast(`Publié en ${secs} s. ${site.client} voit la mise à jour sur son lien.`);
    });
  }
  function closeComposer() { clearInterval(timer); $("#composer").hidden = true; $("#composer").innerHTML = ""; }

  let toastT = null;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800); }

  /* ---------- Navigation ---------- */
  function go(view) { state.view = view; if (location.hash !== "#" + view) location.hash = view; render(); window.scrollTo(0, 0); }
  function fromHash() { const h = location.hash.slice(1); state.view = h === "client" ? "client" : "artisan"; render(); }
  window.addEventListener("hashchange", fromHash);

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button, a");
    if (!b) return;
    if (b.dataset.market) { state.market = b.dataset.market; state.tab = "journal"; try { localStorage.setItem("archfield-market", state.market); } catch (err) {} render(); }
    else if (b.dataset.view) go(b.dataset.view);
    else if (b.dataset.publish !== undefined) openComposer(b.dataset.publish || state.chantier[state.market]);
    else if (b.dataset.openClient) { state.chantier[state.market] = b.dataset.openClient; state.tab = "journal"; go("client"); }
    else if (b.dataset.tab) { state.tab = b.dataset.tab; renderClient(); }
    else if (b.dataset.validate !== undefined) {
      const c = current(), i = Number(b.dataset.validate), st = c.etapes[i];
      st.statut = "validee";
      const nxt = c.etapes[i + 1];
      if (nxt && nxt.statut === "a_venir" && !c.etapes.some((x) => x.statut === "en_cours")) { nxt.statut = "en_cours"; nxt.reel = 1; }
      c.journal.unshift({ d: new Date().toISOString(), etape: i, t: `Étape « ${st.nom} » validée par ${c.client}.`, sys: true, photos: [] });
      renderClient();
      toast(`Étape validée. Notification envoyée à ${M().artisan.contact}.`);
    }
    else if (b.dataset.copy) {
      const text = "https://" + b.dataset.copy;
      const done = () => toast("Lien copié. Envoyez-le au client par WhatsApp ou par e-mail.");
      try { navigator.clipboard.writeText(text).then(done, () => toast(text)); } catch (err) { toast(text); }
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "client-site") { state.chantier[state.market] = e.target.value; state.tab = "journal"; renderClient(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#composer").hidden) closeComposer(); });
  $("#composer").addEventListener("click", (e) => { if (e.target.id === "composer") closeComposer(); });

  fromHash();
})();
</script>
</body>
</html>
