# Archfield en production sur un serveur Linux : l'application, et Caddy devant elle pour le HTTPS automatique
# (certificat Let's Encrypt gratuit, renouvelé tout seul). Guide complet : deploy/HEBERGEMENT.md
# Démarrer ou mettre à jour : docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data            # base de données et photos : à sauvegarder (deploy/sauvegarde.sh)
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Indiquez DOMAIN dans le fichier .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats HTTPS
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
